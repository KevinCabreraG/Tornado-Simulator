<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tornado Simulator</title>
  <style>
    :root{
      --bg:#0b1020;
      --txt:#e9eeff;
      --muted:#9fb0ff;
      --accent:#76d6ff;
      --danger:#ff7b7b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 60% 10%, #15214a 0%, var(--bg) 55%, #060913 100%);
      color:var(--txt);
      display:flex;
      min-height:100vh;
      overflow:hidden;
    }
    .wrap{
      display:grid;
      grid-template-columns: 1fr 340px;
      gap:14px;
      padding:14px;
      width:100%;
      height:100vh;
    }
    .left{
      display:grid;
      grid-template-rows: auto 1fr auto;
      gap:12px;
      min-width:0;
    }
    .topbar{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding:10px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      backdrop-filter: blur(8px);
    }
    .topbar h1{
      font-size:16px;
      margin:0 8px 0 0;
      letter-spacing:.2px;
      color:var(--txt);
      font-weight:700;
    }
    .btn{
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color:var(--txt);
      padding:8px 10px;
      border-radius:12px;
      font-weight:650;
      font-size:13px;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.22); }
    .btn:active{ transform: translateY(1px); }
    .btn.on{
      background: rgba(118,214,255,0.16);
      border-color: rgba(118,214,255,0.45);
      color:#e9fbff;
    }
    .btn.danger{
      background: rgba(255,123,123,0.12);
      border-color: rgba(255,123,123,0.35);
    }
    .ctrl{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      font-size:13px;
    }
    label{ color:var(--muted); font-weight:650; }
    select, input[type="range"]{ accent-color: var(--accent); }

    .stage{
      position:relative;
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.15));
      min-width:0;
    }
    canvas{ display:block; width:100%; height:100%; }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      background: rgba(0,0,0,0.20);
      color: var(--muted);
      font-size:13px;
    }
    .hint{
      color: var(--muted);
      font-size:12px;
      line-height:1.25;
    }

    /* ✅ FIXED: right column panels always have real height */
    .right{
      display:grid;
      grid-template-rows: 1fr 1fr 1fr; /* equal heights so mini-map can't collapse */
      gap:12px;
      min-width:0;
      height: 100%;
    }
    .panel{
      background: rgba(0,0,0,0.20);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      overflow:hidden;
      min-width:0;
    }
    .panelHeader{
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: rgba(255,255,255,0.04);
      border-bottom:1px solid rgba(255,255,255,0.08);
      font-weight:800;
      letter-spacing:.2px;
    }
    .panelBody{
      padding:10px;
      height: calc(100% - 44px);
      min-height: 220px; /* ensures canvases stay visible */
    }
    .panelBody .canvasBox{
      height:100%;
      border-radius:12px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.25);
    }
    .tag{
      font-size:12px;
      color: var(--muted);
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="topbar">
        <h1>🌪️ Tornado Simulator</h1>

        <button id="btnRandom" class="btn">🎲 Random Storm</button>
        <button id="btnRain" class="btn">🌧️ Rain</button>
        <button id="btnLightning" class="btn">⚡ Lightning</button>
        <button id="btnKeep" class="btn on">📌 Keep Tornado</button>
        <button id="btnReset" class="btn danger">🔁 Reset Storm</button>

        <div class="ctrl" title="EF scale changes mini-map tornado radius and damage force">
          <label for="ef">EF:</label>
          <input id="ef" type="range" min="0" max="5" step="1" value="2" />
          <span id="efVal" style="font-weight:800;">2</span>
        </div>

        <div class="ctrl" title="Tornado shape type">
          <label for="type">Type:</label>
          <select id="type">
            <option value="wedge">Wedge</option>
            <option value="cone" selected>Cone</option>
            <option value="rope">Rope</option>
          </select>
        </div>

        <div class="hint">Controls: <b>Arrow keys</b> to move. If Keep Tornado is OFF, it will <b>rope out</b> and vanish.</div>
      </div>

      <div class="stage">
        <canvas id="sim"></canvas>
      </div>

      <div class="footer">
        <div>Made by Kevin Cabrera</div>
        <div class="tag">Tip: Try EF5 + Wedge + Lightning 😈</div>
      </div>
    </div>

    <div class="right">
      <div class="panel">
        <div class="panelHeader">
          <div>🗺️ Mini Map</div>
          <div class="tag" id="miniTag">Active</div>
        </div>
        <div class="panelBody">
          <div class="canvasBox">
            <canvas id="mini"></canvas>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panelHeader">
          <div>📡 Radar</div>
          <div class="tag">Blips fade ~1s</div>
        </div>
        <div class="panelBody">
          <div class="canvasBox">
            <canvas id="radar"></canvas>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panelHeader">
          <div>ℹ️ Status</div>
          <div class="tag" id="stormTag">—</div>
        </div>
        <div class="panelBody" style="padding:12px; display:flex; flex-direction:column; gap:10px;">
          <div class="hint" id="statusLine1"></div>
          <div class="hint" id="statusLine2"></div>
          <div class="hint" id="statusLine3"></div>
          <div class="hint" style="opacity:.9;">
            Implemented:
            <b>trail</b>, <b>rope-out vanish</b>, <b>object push</b>, <b>cars move</b>, <b>radar blips</b>.
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ---------- Helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a=0, b=1) => a + Math.random()*(b-a);
  const choose = (arr) => arr[Math.floor(Math.random()*arr.length)];
  const dist2 = (ax, ay, bx, by) => {
    const dx = ax - bx, dy = ay - by;
    return dx*dx + dy*dy;
  };

  // ---------- Canvas setup ----------
  const sim = document.getElementById('sim');
  const mini = document.getElementById('mini');
  const radar = document.getElementById('radar');
  const ctx = sim.getContext('2d');
  const mctx = mini.getContext('2d');
  const rctx = radar.getContext('2d');

  function fitCanvas(c) {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const rect = c.getBoundingClientRect();
    c.width = Math.floor(rect.width * dpr);
    c.height = Math.floor(rect.height * dpr);
    const cctx = c.getContext('2d');
    cctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function resizeAll() {
    fitCanvas(sim);
    fitCanvas(mini);
    fitCanvas(radar);
  }
  window.addEventListener('resize', resizeAll);

  // ---------- UI ----------
  const btnRandom = document.getElementById('btnRandom');
  const btnRain = document.getElementById('btnRain');
  const btnLightning = document.getElementById('btnLightning');
  const btnKeep = document.getElementById('btnKeep');
  const btnReset = document.getElementById('btnReset');
  const efSlider = document.getElementById('ef');
  const efVal = document.getElementById('efVal');
  const typeSel = document.getElementById('type');
  const miniTag = document.getElementById('miniTag');
  const stormTag = document.getElementById('stormTag');

  const statusLine1 = document.getElementById('statusLine1');
  const statusLine2 = document.getElementById('statusLine2');
  const statusLine3 = document.getElementById('statusLine3');

  // ---------- Storm / Tornado state ----------
  const storm = {
    hasRain: false,
    hasLightning: false,
    keepTornado: true,
    type: 'cone',
    ef: 2,
    active: true,
    ropingOut: false,
    vanishT: 0,
    lightningFlash: 0,
  };

  const tornado = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    speed: 2.6,
    trail: [], // {x,y,wx,wy}
  };

  // ---------- Mini map world ----------
  const world = {
    w: 520,
    h: 520,
    grid: 40,
    objects: [],
    cars: [],
    blips: [],
  };

  function buildWorld() {
    world.objects.length = 0;
    world.cars.length = 0;
    world.blips.length = 0;

    const mkObj = (kind, x, y) => ({
      kind, x, y,
      vx: 0, vy: 0,
      moved: 0,
    });

    for (let i=0;i<14;i++){
      world.objects.push(mkObj('house', rand(60, world.w-60), rand(60, world.h-60)));
    }
    for (let i=0;i<22;i++){
      world.objects.push(mkObj('tree', rand(30, world.w-30), rand(30, world.h-30)));
    }

    for (let i=0;i<8;i++){
      const laneY = choose([120, 200, 280, 360, 440]);
      world.cars.push({
        x: rand(0, world.w),
        y: laneY + rand(-6, 6),
        vx: choose([1.2, 1.5, 1.8]) * choose([1,-1]),
      });
    }
  }

  // ---------- Particles ----------
  const rainDrops = [];
  function spawnRain(count=10) {
    const w = sim.getBoundingClientRect().width;
    const h = sim.getBoundingClientRect().height;
    for (let i=0;i<count;i++){
      rainDrops.push({
        x: rand(0, w),
        y: rand(-h, 0),
        vy: rand(8, 14),
        vx: rand(-1.0, 1.0),
        len: rand(10, 18),
      });
    }
  }

  // ---------- EF scaling ----------
  function efToRadius(ef) { return 16 + ef * 14; }
  function efToPush(ef) { return (ef/5) ** 1.2; }

  function currentMiniRadius() {
    let r = efToRadius(storm.ef);
    if (storm.ropingOut){
      const shrink = 1 - 0.82 * storm.vanishT;
      r *= shrink;
      r = Math.max(8, r);
    }
    if (!storm.active) r = 0;
    return r;
  }

  // ---------- Radar blips ----------
  function addRadarBlip(x, y) {
    world.blips.push({ x, y, t: 1.0 });
  }

  // ---------- Object physics ----------
  function objectMass(kind){ return kind === 'house' ? 1.8 : 0.85; }

  function updateObjectPhysics(dt) {
    for (const o of world.objects){
      o.vx *= 0.90;
      o.vy *= 0.90;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      o.x = clamp(o.x, 12, world.w-12);
      o.y = clamp(o.y, 12, world.h-12);
    }
  }

  function pushObjectsNearTornado(dt) {
    if (!storm.active) return;

    const R = currentMiniRadius();
    const R2 = R*R;
    const strength = efToPush(storm.ef);
    if (strength <= 0) return;

    const tx = tornado.x;
    const ty = tornado.y;

    for (const o of world.objects){
      const d2 = dist2(tx, ty, o.x, o.y);
      if (d2 <= R2){
        const d = Math.sqrt(d2) + 0.0001;
        const nx = (o.x - tx) / d;
        const ny = (o.y - ty) / d;

        const sx = -ny;
        const sy = nx;

        const mass = objectMass(o.kind);
        const falloff = 1 - (d / R);
        const impulse = (260 * strength * falloff / mass) * dt;

        o.vx += (nx * impulse) + (sx * impulse * 0.35);
        o.vy += (ny * impulse) + (sy * impulse * 0.35);

        if (Math.random() < 0.15 * dt) addRadarBlip(o.x, o.y);
      }
    }
  }

  // ---------- Cars ----------
  function updateCars(dt) {
    for (const c of world.cars){
      c.x += c.vx * dt * 50/60;
      if (c.x < -20) c.x = world.w + 20;
      if (c.x > world.w + 20) c.x = -20;

      if (storm.active){
        const R = currentMiniRadius() * 0.75;
        const d2 = dist2(tornado.x, tornado.y, c.x, c.y);
        if (d2 < R*R){
          const d = Math.sqrt(d2)+0.001;
          const nx = (c.x - tornado.x)/d;
          const ny = (c.y - tornado.y)/d;
          const strength = efToPush(storm.ef);
          c.x += nx * strength * 3.5;
          c.y += ny * strength * 2.0;
          if (Math.random() < 0.08 * dt) addRadarBlip(c.x, c.y);
        }
      }
      c.y = clamp(c.y, 20, world.h-20);
    }
  }

  // ---------- Tornado life-cycle ----------
  function startRopeOut() {
    if (!storm.active) return;
    storm.ropingOut = true;
    storm.vanishT = 0;
  }

  function resetStorm() {
    storm.hasRain = false;
    storm.hasLightning = false;
    storm.keepTornado = true;
    storm.type = 'cone';
    storm.ef = 2;
    storm.active = true;
    storm.ropingOut = false;
    storm.vanishT = 0;
    storm.lightningFlash = 0;

    tornado.x = world.w/2;
    tornado.y = world.h/2;
    tornado.vx = tornado.vy = 0;
    tornado.trail.length = 0;

    rainDrops.length = 0;
    buildWorld();

    syncUI();
  }

  // ---------- Input ----------
  const keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };
  window.addEventListener('keydown', (e) => {
    if (e.key in keys) { keys[e.key] = true; e.preventDefault(); }
  }, { passive:false });
  window.addEventListener('keyup', (e) => {
    if (e.key in keys) { keys[e.key] = false; e.preventDefault(); }
  }, { passive:false });

  // ---------- UI events ----------
  function syncUI(){
    btnRain.classList.toggle('on', storm.hasRain);
    btnLightning.classList.toggle('on', storm.hasLightning);
    btnKeep.classList.toggle('on', storm.keepTornado);

    efSlider.value = String(storm.ef);
    efVal.textContent = String(storm.ef);
    typeSel.value = storm.type;

    const kind = storm.type[0].toUpperCase() + storm.type.slice(1);
    stormTag.textContent = `${kind} • EF${storm.ef} • ${storm.active ? (storm.ropingOut ? 'Roping out' : 'Active') : 'Vanished'}`;
    miniTag.textContent = storm.active ? "Active" : "Inactive";
    miniTag.style.color = storm.active ? "var(--muted)" : "var(--danger)";
  }

  btnRain.addEventListener('click', () => { storm.hasRain = !storm.hasRain; syncUI(); });
  btnLightning.addEventListener('click', () => { storm.hasLightning = !storm.hasLightning; syncUI(); });

  btnKeep.addEventListener('click', () => {
    storm.keepTornado = !storm.keepTornado;
    if (!storm.keepTornado) startRopeOut();
    syncUI();
  });

  btnRandom.addEventListener('click', () => {
    storm.type = choose(['wedge','cone','rope']);
    storm.hasRain = Math.random() < 0.75;
    storm.hasLightning = Math.random() < 0.6;
    storm.keepTornado = true;
    storm.active = true;
    storm.ropingOut = false;
    storm.vanishT = 0;

    const roll = Math.random();
    storm.ef = roll < 0.32 ? 0 : roll < 0.58 ? 1 : roll < 0.76 ? 2 : roll < 0.88 ? 3 : roll < 0.96 ? 4 : 5;

    tornado.x = rand(60, world.w-60);
    tornado.y = rand(60, world.h-60);
    tornado.trail.length = 0;

    syncUI();
  });

  btnReset.addEventListener('click', resetStorm);

  efSlider.addEventListener('input', () => {
    storm.ef = parseInt(efSlider.value, 10);
    efVal.textContent = String(storm.ef);
    syncUI();
  });

  typeSel.addEventListener('change', () => { storm.type = typeSel.value; syncUI(); });

  // ---------- Drawing: main sim ----------
  let perfT = 0;

  function drawSkyBackground(w, h) {
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, 'rgba(25, 40, 85, 0.75)');
    g.addColorStop(0.45, 'rgba(13, 20, 45, 0.85)');
    g.addColorStop(1, 'rgba(5, 8, 18, 0.95)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    for (let i=0;i<9;i++){
      const y = (h*0.08) + i*(h*0.08) + Math.sin(perfT*0.0007 + i)*8;
      ctx.fillStyle = `rgba(255,255,255,${0.02 + i*0.001})`;
      ctx.fillRect(0, y, w, 22);
    }
  }

  function drawLightningFlash(w, h) {
    if (storm.lightningFlash <= 0) return;
    const a = storm.lightningFlash;
    ctx.fillStyle = `rgba(255,255,255,${0.45 * a})`;
    ctx.fillRect(0,0,w,h);
  }

  function drawRain(w, h) {
    if (!storm.hasRain) return;
    if (rainDrops.length < 420) spawnRain(14);

    ctx.lineWidth = 1;
    for (let i=rainDrops.length-1;i>=0;i--){
      const d = rainDrops[i];
      ctx.strokeStyle = 'rgba(200,220,255,0.22)';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.vx*1.5, d.y + d.len);
      ctx.stroke();

      d.x += d.vx;
      d.y += d.vy;

      if (d.y > h + 30){
        d.y = rand(-200, -20);
        d.x = rand(0, w);
        d.vy = rand(8,14);
        d.vx = rand(-1.0, 1.0);
        d.len = rand(10,18);
      }
    }
  }

  /* ✅ FIXED: Clearly defined WEDGE / CONE / ROPE shapes */
  function drawTornadoMain(w, h) {
    const cx = w * 0.5;
    const topY = h * 0.14;
    const groundY = h * 0.80;

    // Trail (white)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<tornado.trail.length;i++){
      const p = tornado.trail[i];
      const a = i / tornado.trail.length;
      ctx.strokeStyle = `rgba(255,255,255,${0.06 * a})`;
      ctx.lineWidth = 10 * a;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + 0.01, p.y + 0.01);
      ctx.stroke();
    }
    ctx.restore();

    if (!storm.active) return;

    const fade = storm.ropingOut ? (1 - storm.vanishT) : 1;
    ctx.globalAlpha = fade;

    const efScale = 0.75 + storm.ef * 0.20;

    let topW, baseW;
    if (storm.type === "wedge") {
      topW = 120 * efScale;
      baseW = 320 * efScale;
    } else if (storm.type === "cone") {
      topW = 40 * efScale;
      baseW = 220 * efScale;
    } else {
      topW = 18 * efScale;
      baseW = 45 * efScale;
    }

    if (storm.ropingOut) {
      const t = storm.vanishT;
      baseW *= (1 - 0.70*t);
      topW  *= (1 - 0.85*t);
      baseW = Math.max(10, baseW);
      topW  = Math.max(6, topW);
    }

    const wob = Math.sin(perfT*0.004) * 10;
    const wob2 = Math.cos(perfT*0.003) * 6;

    const bodyGrad = ctx.createLinearGradient(0, topY, 0, groundY);
    bodyGrad.addColorStop(0, "rgba(240,248,255,0.20)");
    bodyGrad.addColorStop(0.55, "rgba(230,240,255,0.14)");
    bodyGrad.addColorStop(1, "rgba(255,255,255,0.10)");

    const leftTopX  = cx - topW/2 + wob2;
    const rightTopX = cx + topW/2 + wob2;
    const leftBaseX = cx - baseW/2 + wob;
    const rightBaseX= cx + baseW/2 + wob;

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(leftTopX, topY);
    ctx.lineTo(rightTopX, topY);
    ctx.lineTo(rightBaseX, groundY);
    ctx.lineTo(leftBaseX, groundY);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.30)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Inner shading bands (still readable)
    ctx.save();
    ctx.clip();
    for (let i=0;i<10;i++){
      const t = i/9;
      const y = topY + t*(groundY-topY);
      const wHere = topW + (baseW-topW)*t;
      const bandW = wHere * 0.45;
      ctx.fillStyle = `rgba(255,255,255,${0.05 * (1-t)})`;
      ctx.beginPath();
      ctx.ellipse(cx + Math.sin(perfT*0.004 + t*8)*10, y, bandW, 16, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // Debris base
    ctx.fillStyle = "rgba(255,255,255,0.14)";
    ctx.beginPath();
    ctx.ellipse(cx + wob*0.2, groundY + 12, baseW*0.60, 28, 0, 0, Math.PI*2);
    ctx.fill();

    if (storm.type === "rope") {
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx + wob2, topY);
      ctx.lineTo(cx + wob, groundY);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
  }

  // ---------- Mini map ----------
  function drawMiniMap() {
    const w = mini.getBoundingClientRect().width;
    const h = mini.getBoundingClientRect().height;
    const sx = w / world.w;
    const sy = h / world.h;

    mctx.clearRect(0,0,w,h);
    mctx.fillStyle = 'rgba(10, 18, 35, 0.92)';
    mctx.fillRect(0,0,w,h);

    // grid
    mctx.strokeStyle = 'rgba(255,255,255,0.06)';
    mctx.lineWidth = 1;
    for (let x=0; x<=world.w; x+=world.grid){
      mctx.beginPath();
      mctx.moveTo(x*sx, 0);
      mctx.lineTo(x*sx, h);
      mctx.stroke();
    }
    for (let y=0; y<=world.h; y+=world.grid){
      mctx.beginPath();
      mctx.moveTo(0, y*sy);
      mctx.lineTo(w, y*sy);
      mctx.stroke();
    }

    // objects
    for (const o of world.objects){
      const px = o.x*sx, py = o.y*sy;
      if (o.kind === 'house'){
        mctx.fillStyle = 'rgba(170,190,255,0.90)';
        mctx.strokeStyle = 'rgba(0,0,0,0.35)';
        mctx.fillRect(px-7, py-7, 14, 14);
        mctx.strokeRect(px-7, py-7, 14, 14);
      } else {
        mctx.fillStyle = 'rgba(120,255,180,0.85)';
        mctx.beginPath();
        mctx.arc(px, py, 6, 0, Math.PI*2);
        mctx.fill();
      }
    }

    // cars
    for (const c of world.cars){
      const px = c.x*sx, py = c.y*sy;
      mctx.fillStyle = 'rgba(255,230,120,0.9)';
      mctx.fillRect(px-6, py-3, 12, 6);
    }

    // path trail in mini-map (white)
    if (tornado.trail.length){
      mctx.strokeStyle = 'rgba(255,255,255,0.18)';
      mctx.lineWidth = 2;
      mctx.beginPath();
      for (let i=0;i<tornado.trail.length;i++){
        const p = tornado.trail[i];
        const px = p.wx * sx, py = p.wy * sy;
        if (i===0) mctx.moveTo(px, py);
        else mctx.lineTo(px, py);
      }
      mctx.stroke();
    }

    // tornado marker + radius
    const px = tornado.x*sx, py = tornado.y*sy;
    if (storm.active){
      const R = currentMiniRadius();
      mctx.fillStyle = 'rgba(255,255,255,0.85)';
      mctx.beginPath();
      mctx.arc(px, py, 5, 0, Math.PI*2);
      mctx.fill();

      mctx.strokeStyle = 'rgba(255,255,255,0.25)';
      mctx.lineWidth = 2;
      mctx.beginPath();
      mctx.arc(px, py, R*sx, 0, Math.PI*2);
      mctx.stroke();
    } else {
      mctx.fillStyle = 'rgba(255,123,123,0.8)';
      mctx.beginPath();
      mctx.arc(px, py, 4, 0, Math.PI*2);
      mctx.fill();
    }
  }

  // ---------- Radar ----------
  function drawRadar() {
    const w = radar.getBoundingClientRect().width;
    const h = radar.getBoundingClientRect().height;
    const sx = w / world.w;
    const sy = h / world.h;

    rctx.clearRect(0,0,w,h);
    rctx.fillStyle = 'rgba(0, 25, 12, 0.85)';
    rctx.fillRect(0,0,w,h);

    rctx.strokeStyle = 'rgba(120,255,180,0.06)';
    rctx.lineWidth = 1;
    for (let i=0;i<7;i++){
      rctx.beginPath();
      rctx.arc(w/2, h/2, (Math.min(w,h)/2)*(i/7), 0, Math.PI*2);
      rctx.stroke();
    }

    if (storm.active){
      const px = tornado.x*sx, py = tornado.y*sy;
      rctx.fillStyle = 'rgba(120,255,180,0.75)';
      rctx.beginPath();
      rctx.arc(px, py, 4, 0, Math.PI*2);
      rctx.fill();
    }

    for (const b of world.blips){
      const px = b.x*sx, py = b.y*sy;
      rctx.fillStyle = `rgba(255,255,255,${0.9*b.t})`;
      rctx.beginPath();
      rctx.arc(px, py, 3, 0, Math.PI*2);
      rctx.fill();
    }
  }

  // ---------- Status ----------
  function updateStatusText() {
    const kind = storm.type[0].toUpperCase() + storm.type.slice(1);
    statusLine1.innerHTML = `Storm: <b>${kind}</b> • EF<b>${storm.ef}</b> • Rain: <b>${storm.hasRain ? 'ON' : 'OFF'}</b> • Lightning: <b>${storm.hasLightning ? 'ON' : 'OFF'}</b>`;
    statusLine2.innerHTML = `Tornado: <b>${storm.active ? (storm.ropingOut ? 'Roping out' : 'Active') : 'Vanished'}</b> • Keep Tornado: <b>${storm.keepTornado ? 'ON' : 'OFF'}</b>`;
    statusLine3.innerHTML = `Mini-map radius: <b>${Math.round(currentMiniRadius())} px</b> • Arrow keys: <b>move</b> (if tornado exists)`;
  }

  // ---------- Main loop ----------
  let last = performance.now();

  function step(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    perfT = now;

    // lightning random flash
    if (storm.hasLightning && Math.random() < 0.015){
      storm.lightningFlash = 1.0;
    }
    storm.lightningFlash *= 0.88;

    // Movement (ONLY if tornado exists)
    tornado.vx = 0; tornado.vy = 0;
    if (storm.active){
      if (keys.ArrowLeft) tornado.vx -= 1;
      if (keys.ArrowRight) tornado.vx += 1;
      if (keys.ArrowUp) tornado.vy -= 1;
      if (keys.ArrowDown) tornado.vy += 1;

      const len = Math.hypot(tornado.vx, tornado.vy) || 1;
      tornado.vx = (tornado.vx/len) * tornado.speed;
      tornado.vy = (tornado.vy/len) * tornado.speed;

      tornado.x = clamp(tornado.x + tornado.vx * (dt*60), 0, world.w);
      tornado.y = clamp(tornado.y + tornado.vy * (dt*60), 0, world.h);
    }

    // Rope out if keep is off
    if (!storm.keepTornado && storm.active && !storm.ropingOut) startRopeOut();
    if (storm.ropingOut){
      storm.vanishT += dt * 0.28; // ~3.5s
      if (storm.vanishT >= 1){
        storm.vanishT = 1;
        storm.active = false;
        storm.ropingOut = false;
      }
    }

    // Trail (screen coords + world coords)
    const simW = sim.getBoundingClientRect().width;
    const simH = sim.getBoundingClientRect().height;
    const screenX = simW*0.5 + Math.sin(now*0.005)*2;
    const screenY = simH*0.55 + Math.cos(now*0.004)*2;

    tornado.trail.push({ x: screenX, y: screenY, wx: tornado.x, wy: tornado.y });
    if (tornado.trail.length > 90) tornado.trail.shift();

    updateCars(dt);
    pushObjectsNearTornado(dt);
    updateObjectPhysics(dt);

    for (let i=world.blips.length-1;i>=0;i--){
      world.blips[i].t -= dt * 1.2;
      if (world.blips[i].t <= 0) world.blips.splice(i,1);
    }

    resizeAll();
    draw();

    syncUI();
    updateStatusText();

    requestAnimationFrame(step);
  }

  function draw() {
    const w = sim.getBoundingClientRect().width;
    const h = sim.getBoundingClientRect().height;

    ctx.clearRect(0,0,w,h);
    drawSkyBackground(w,h);

    // horizon ground
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, h*0.78, w, h*0.22);

    drawRain(w,h);
    drawTornadoMain(w,h);
    drawLightningFlash(w,h);

    ctx.fillStyle = 'rgba(233,238,255,0.8)';
    ctx.font = '700 14px system-ui';
    const kind = storm.type[0].toUpperCase() + storm.type.slice(1);
    ctx.fillText(`${kind} • EF${storm.ef}`, 14, 24);

    drawMiniMap();
    drawRadar();
  }

  // ---------- init ----------
  resizeAll();
  buildWorld();
  tornado.x = world.w/2;
  tornado.y = world.h/2;
  syncUI();
  updateStatusText();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
