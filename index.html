<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tornado Simulator</title>
  <style>
    :root{
      --bg:#0b1020; --txt:#e9eeff; --muted:#9fb0ff; --accent:#76d6ff; --danger:#ff7b7b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(1200px 700px at 60% 10%, #15214a 0%, var(--bg) 55%, #060913 100%);
      color:var(--txt);
      display:flex;
      min-height:100vh;
      overflow:hidden;
    }
    .wrap{
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:14px;
      padding:14px;
      width:100%;
      height:100vh;
    }
    .left{ display:grid; grid-template-rows:auto 1fr auto; gap:12px; min-width:0; }
    .topbar{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(8px);
    }
    .topbar h1{ font-size:16px; margin:0 8px 0 0; letter-spacing:.2px; font-weight:950; }
    .btn{
      cursor:pointer;
      border:1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color:var(--txt);
      padding:8px 10px;
      border-radius:12px;
      font-weight:900;
      font-size:13px;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.22); }
    .btn:active{ transform: translateY(1px); }
    .btn.on{ background: rgba(118,214,255,0.16); border-color: rgba(118,214,255,0.45); color:#e9fbff; }
    .btn.danger{ background: rgba(255,123,123,0.12); border-color: rgba(255,123,123,0.35); }

    .ctrl{
      display:flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.18);
      font-size:13px;
    }
    label{ color:var(--muted); font-weight:950; }
    select, input[type="range"]{ accent-color: var(--accent); }

    .stage{
      position:relative;
      border-radius:16px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.15));
      min-width:0;
    }
    canvas{ display:block; width:100%; height:100%; }

    .footer{
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      background: rgba(0,0,0,0.20);
      color: var(--muted);
      font-size:13px;
    }
    .hint{ color:var(--muted); font-size:12px; line-height:1.25; }

    .right{
      display:grid;
      grid-template-rows: 1fr 1fr 1fr;
      gap:12px;
      min-width:0;
      height:100%;
    }
    .panel{
      background: rgba(0,0,0,0.20);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      overflow:hidden;
      min-width:0;
    }
    .panelHeader{
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background: rgba(255,255,255,0.04);
      border-bottom:1px solid rgba(255,255,255,0.08);
      font-weight:950;
      letter-spacing:.2px;
    }
    .panelBody{
      padding:10px;
      height: calc(100% - 44px);
      min-height: 220px;
    }
    .canvasBox{
      height:100%;
      border-radius:12px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.25);
    }
    .tag{ font-size:12px; color:var(--muted); font-weight:900; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="topbar">
        <h1>🌪️ Tornado Simulator</h1>

        <button id="btnRandom" class="btn">🎲 Random Storm</button>
        <button id="btnRain" class="btn">🌧️ Rain</button>
        <button id="btnLightning" class="btn">⚡ Lightning</button>
        <button id="btnKeep" class="btn on">📌 Keep Tornado</button>
        <button id="btnReset" class="btn danger">🔁 Reset Storm</button>

        <div class="ctrl" title="EF scale changes mini-map radius + how hard stuff gets moved">
          <label for="ef">EF:</label>
          <input id="ef" type="range" min="0" max="5" step="1" value="2" />
          <span id="efVal" style="font-weight:950;">2</span>
        </div>

        <div class="ctrl" title="Tornado shape type">
          <label for="type">Type:</label>
          <select id="type">
            <option value="wedge">Wedge</option>
            <option value="cone" selected>Cone</option>
            <option value="rope">Rope</option>
          </select>
        </div>

        <div class="hint">Arrow keys move it (small movement). Dot-hit flings objects. Radar sweeps.</div>
      </div>

      <div class="stage"><canvas id="sim"></canvas></div>

      <div class="footer">
        <div>Made by Kevin Cabrera</div>
        <div class="tag">Mini-map: 🏠 🌳 🚗</div>
      </div>
    </div>

    <div class="right">
      <div class="panel">
        <div class="panelHeader"><div>🗺️ Mini Map</div><div class="tag" id="miniTag">Active</div></div>
        <div class="panelBody"><div class="canvasBox"><canvas id="mini"></canvas></div></div>
      </div>

      <div class="panel">
        <div class="panelHeader"><div>📡 Radar</div><div class="tag">Sweep + blips</div></div>
        <div class="panelBody"><div class="canvasBox"><canvas id="radar"></canvas></div></div>
      </div>

      <div class="panel">
        <div class="panelHeader"><div>ℹ️ Status</div><div class="tag" id="stormTag">—</div></div>
        <div class="panelBody" style="padding:12px; display:flex; flex-direction:column; gap:10px;">
          <div class="hint" id="statusLine1"></div>
          <div class="hint" id="statusLine2"></div>
          <div class="hint" id="statusLine3"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ---------- Helpers ----------
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rand=(a=0,b=1)=>a+Math.random()*(b-a);
  const choose=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
  const lerp=(a,b,t)=>a+(b-a)*t;

  // ---------- Canvas ----------
  const sim=document.getElementById('sim');
  const mini=document.getElementById('mini');
  const radar=document.getElementById('radar');
  const ctx=sim.getContext('2d');
  const mctx=mini.getContext('2d');
  const rctx=radar.getContext('2d');

  function fitCanvas(c){
    const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    const rect=c.getBoundingClientRect();
    c.width=Math.floor(rect.width*dpr);
    c.height=Math.floor(rect.height*dpr);
    c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  }
  function resizeAll(){fitCanvas(sim);fitCanvas(mini);fitCanvas(radar);}
  window.addEventListener('resize',resizeAll);

  // ---------- UI ----------
  const btnRandom=document.getElementById('btnRandom');
  const btnRain=document.getElementById('btnRain');
  const btnLightning=document.getElementById('btnLightning');
  const btnKeep=document.getElementById('btnKeep');
  const btnReset=document.getElementById('btnReset');
  const efSlider=document.getElementById('ef');
  const efVal=document.getElementById('efVal');
  const typeSel=document.getElementById('type');
  const miniTag=document.getElementById('miniTag');
  const stormTag=document.getElementById('stormTag');
  const statusLine1=document.getElementById('statusLine1');
  const statusLine2=document.getElementById('statusLine2');
  const statusLine3=document.getElementById('statusLine3');

  // ---------- World / State ----------
  const world={ w:560, h:560, grid:40, objects:[], cars:[], blips:[] };

  const storm={
    hasRain:false, hasLightning:false, keepTornado:true,
    type:'cone', ef:2,
    active:true, ropingOut:false, vanishT:0,
    bolt:null, boltCooldown:0,
    sweepAng:0,
  };

  const tornado={
    x:world.w/2, y:world.h/2,
    vx:0, vy:0,           // ✅ persistent velocity (DO NOT reset each frame)
    speed:55,             // units/sec (small movement feel)
    trail:[],             // {wx,wy,sx,sy}
  };

  const rainDrops=[];

  // ---------- Radius ----------
  function efBaseRadius(ef){ return [10,16,24,34,48,66][ef] ?? 24; }
  function typeRadiusMult(type){ return type==='wedge'?1.35 : type==='cone'?1.0 : 0.55; }
  function currentRadius(){
    let r=efBaseRadius(storm.ef)*typeRadiusMult(storm.type);
    if(storm.ropingOut){
      const t=storm.vanishT;
      r=Math.max(9, r*(1-0.78*t));
    }
    if(!storm.active) r=0;
    return r;
  }
  function efStrength(ef){ return (ef/5)**1.10; }

  // ---------- Build world ----------
  function buildWorld(){
    world.objects.length=0; world.cars.length=0; world.blips.length=0;
    const mk=(kind,x,y)=>({kind,x,y,vx:0,vy:0});
    for(let i=0;i<12;i++) world.objects.push(mk('house',rand(70,world.w-70),rand(70,world.h-70)));
    for(let i=0;i<20;i++) world.objects.push(mk('tree',rand(30,world.w-30),rand(30,world.h-30)));

    const lanes=[120,200,280,360,440,520];
    for(let i=0;i<10;i++){
      const lane=choose(lanes);
      world.cars.push({
        x:rand(0,world.w),
        y:lane+rand(-4,4),
        lane,
        vx:choose([18,24,30,34])*choose([1,-1])
      });
    }
  }

  // ---------- Rain ----------
  function spawnRain(n=18){
    const w=sim.getBoundingClientRect().width;
    const h=sim.getBoundingClientRect().height;
    for(let i=0;i<n;i++){
      rainDrops.push({x:rand(0,w),y:rand(-h,0),vy:rand(10,16),vx:rand(-1.1,1.1),len:rand(10,22)});
    }
  }

  // ---------- Radar blips ----------
  function addRadarBlip(x,y){ world.blips.push({x,y,t:1.0}); }

  // ---------- Physics ----------
  function objectMass(kind){ return kind==='house'?2.1:0.95; }

  function updateObjects(dt){
    for(const o of world.objects){
      o.vx*=0.90; o.vy*=0.90;
      o.x+=o.vx*dt; o.y+=o.vy*dt;
      o.x=clamp(o.x,12,world.w-12);
      o.y=clamp(o.y,12,world.h-12);
    }
  }

  function updateCars(dt){
    for(const c of world.cars){
      c.x += c.vx*dt;
      c.y += (c.lane - c.y)*0.04;
      if(c.x<-30) c.x=world.w+30;
      if(c.x>world.w+30) c.x=-30;

      if(storm.active){
        const R=currentRadius()*0.85;
        const d2=dist2(tornado.x,tornado.y,c.x,c.y);
        if(d2<R*R){
          const d=Math.sqrt(d2)+0.001;
          const nx=(c.x-tornado.x)/d, ny=(c.y-tornado.y)/d;
          const s=efStrength(storm.ef);
          const close=d<Math.max(10,currentRadius()*0.25);
          const k=close?55:18;
          c.x += nx*s*k*dt;
          c.y += ny*s*(k*0.55)*dt;
          if(Math.random()<0.25*dt) addRadarBlip(c.x,c.y);
        }
      }
      c.y=clamp(c.y,18,world.h-18);
    }
  }

  function tornadoAffectsThings(dt){
    if(!storm.active) return;
    const R=currentRadius(), R2=R*R;
    const s=efStrength(storm.ef);
    const tx=tornado.x, ty=tornado.y;

    const hitR=Math.max(10,R*0.20);
    const hitR2=hitR*hitR;

    for(const o of world.objects){
      const d2=dist2(tx,ty,o.x,o.y);
      const d=Math.sqrt(d2)+0.0001;

      if(d2<=hitR2){
        // ✅ FLING
        const nx=(o.x-tx)/d, ny=(o.y-ty)/d;
        const sx=-ny, sy=nx;
        const mass=objectMass(o.kind);
        const fling=(220+520*s)/mass;
        o.vx += (nx*fling) + (sx*fling*0.35) + rand(-80,80);
        o.vy += (ny*fling) + (sy*fling*0.35) + rand(-80,80);
        addRadarBlip(o.x,o.y);
        continue;
      }

      if(d2<=R2){
        const nx=(o.x-tx)/d, ny=(o.y-ty)/d;
        const sx=-ny, sy=nx;
        const mass=objectMass(o.kind);
        const falloff=1-(d/R);
        const impulse=(120*s*falloff/mass)*dt;
        o.vx += (nx*impulse*26) + (sx*impulse*36);
        o.vy += (ny*impulse*26) + (sy*impulse*36);
        if(Math.random()<0.12*dt) addRadarBlip(o.x,o.y);
      }
    }
  }

  // ---------- Rope-out / reset ----------
  function startRopeOut(){ if(!storm.active) return; storm.ropingOut=true; storm.vanishT=0; }
  function resetStorm(){
    storm.hasRain=false; storm.hasLightning=false; storm.keepTornado=true;
    storm.type='cone'; storm.ef=2;
    storm.active=true; storm.ropingOut=false; storm.vanishT=0;
    storm.bolt=null; storm.boltCooldown=0; storm.sweepAng=0;

    tornado.x=world.w/2; tornado.y=world.h/2;
    tornado.vx=0; tornado.vy=0;
    tornado.trail.length=0;

    rainDrops.length=0;
    buildWorld();
    syncUI();
  }

  // ---------- Input ----------
  const keys={ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false};
  window.addEventListener('keydown',(e)=>{ if(e.key in keys){ keys[e.key]=true; e.preventDefault(); } },{passive:false});
  window.addEventListener('keyup',(e)=>{ if(e.key in keys){ keys[e.key]=false; e.preventDefault(); } },{passive:false});

  // ---------- UI ----------
  function syncUI(){
    btnRain.classList.toggle('on',storm.hasRain);
    btnLightning.classList.toggle('on',storm.hasLightning);
    btnKeep.classList.toggle('on',storm.keepTornado);

    efSlider.value=String(storm.ef);
    efVal.textContent=String(storm.ef);
    typeSel.value=storm.type;

    const kind=storm.type[0].toUpperCase()+storm.type.slice(1);
    stormTag.textContent=`${kind} • EF${storm.ef} • ${storm.active?(storm.ropingOut?'Roping out':'Active'):'Vanished'}`;
    miniTag.textContent=storm.active?'Active':'Inactive';
    miniTag.style.color=storm.active?'var(--muted)':'var(--danger)';
  }

  btnRain.addEventListener('click',()=>{ storm.hasRain=!storm.hasRain; syncUI(); });
  btnLightning.addEventListener('click',()=>{ storm.hasLightning=!storm.hasLightning; syncUI(); });
  btnKeep.addEventListener('click',()=>{ storm.keepTornado=!storm.keepTornado; if(!storm.keepTornado) startRopeOut(); syncUI(); });
  btnReset.addEventListener('click',resetStorm);

  efSlider.addEventListener('input',()=>{ storm.ef=parseInt(efSlider.value,10); efVal.textContent=String(storm.ef); syncUI(); });
  typeSel.addEventListener('change',()=>{ storm.type=typeSel.value; syncUI(); });

  btnRandom.addEventListener('click',()=>{
    storm.type=choose(['wedge','cone','rope']);
    storm.hasRain=Math.random()<0.75;
    storm.hasLightning=Math.random()<0.6;
    storm.keepTornado=true;
    storm.active=true; storm.ropingOut=false; storm.vanishT=0;
    storm.bolt=null; storm.boltCooldown=0;

    const roll=Math.random();
    storm.ef = roll<0.30?0 : roll<0.56?1 : roll<0.76?2 : roll<0.89?3 : roll<0.96?4 : 5;

    tornado.x=rand(80,world.w-80);
    tornado.y=rand(80,world.h-80);
    tornado.vx=0; tornado.vy=0;
    tornado.trail.length=0;

    syncUI();
  });

  // ---------- Lightning bolt ----------
  function generateBolt(w,h){
    const startX=w*0.5+rand(-w*0.28,w*0.28);
    const startY=h*0.16+rand(-10,12);
    const endX=w*0.5+rand(-w*0.20,w*0.20);
    const endY=h*0.80+rand(-16,10);

    const seg=10;
    const pts=[{x:startX,y:startY}];
    for(let i=1;i<seg;i++){
      const t=i/seg;
      pts.push({
        x:startX+(endX-startX)*t+rand(-18,18),
        y:startY+(endY-startY)*t+rand(-10,10)
      });
    }
    pts.push({x:endX,y:endY});

    let branch=null;
    if(Math.random()<0.55){
      const idx=Math.floor(rand(3,seg-2));
      const bx0=pts[idx].x, by0=pts[idx].y;
      branch=[{x:bx0,y:by0}];
      const bEndX=bx0+rand(-80,80);
      const bEndY=by0+rand(50,120);
      for(let j=1;j<=4;j++){
        const tt=j/4;
        branch.push({x:bx0+(bEndX-bx0)*tt+rand(-10,10), y:by0+(bEndY-by0)*tt+rand(-8,10)});
      }
    }
    storm.bolt={pts,branch,t:1.0};
  }

  // ---------- Tornado shapes (photo-like) ----------
  function dimsFor(type, ef, ropingT){
    const s = 0.92 + ef*0.11;

    // tuned to your examples
    let topW, baseW, power;
    if(type==='wedge'){
      topW = 280*s;    // wide top
      baseW = 320*s;   // wide bottom
      power = 0.65;    // keeps it fat
    } else if(type==='cone'){
      topW = 55*s;     // narrow-ish at top
      baseW = 210*s;   // not tiny at bottom
      power = 1.25;    // grows more toward ground
    } else { // rope
      topW = 16*s;
      baseW = 22*s;
      power = 1.00;
    }

    if(ropingT>0){
      topW = lerp(topW, 12, Math.min(1, ropingT*0.95));
      baseW = lerp(baseW, 16, Math.min(1, ropingT*0.90));
      power = lerp(power, 1.0, Math.min(1, ropingT));
    }

    return {topW, baseW, power};
  }

  function widthAt(t, d){
    // t: 0 top -> 1 ground
    const f = Math.pow(t, d.power);
    return lerp(d.topW, d.baseW, f);
  }

  function drawFunnelSilhouette(ctx, cx, topY, groundY, d, isRope){
    const H = groundY - topY;
    const steps = 26;

    // rope has a little S-kink
    const kinkAmp = isRope ? 18 : 6;
    const kinkFreq = isRope ? 2.2 : 1.0;

    const left = [];
    const right = [];

    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const y = topY + t*H;
      const w = widthAt(t, d);

      const centerShift =
        Math.sin((t* Math.PI) * kinkFreq + perfT*0.002) * (kinkAmp*(0.15 + 0.85*t));

      left.push({x: cx + centerShift - w/2, y});
      right.push({x: cx + centerShift + w/2, y});
    }

    // build path
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);

    // left edge (smooth)
    for(let i=1;i<left.length-1;i++){
      const p = left[i];
      const n = left[i+1];
      ctx.quadraticCurveTo(p.x, p.y, (p.x+n.x)/2, (p.y+n.y)/2);
    }
    ctx.lineTo(left[left.length-1].x, left[left.length-1].y);

    // base across
    ctx.lineTo(right[right.length-1].x, right[right.length-1].y);

    // right edge back up (smooth)
    for(let i=right.length-2;i>=1;i--){
      const p = right[i];
      const n = right[i-1];
      ctx.quadraticCurveTo(p.x, p.y, (p.x+n.x)/2, (p.y+n.y)/2);
    }
    ctx.lineTo(right[0].x, right[0].y);
    ctx.closePath();
  }

  // ---------- Drawing ----------
  let perfT=0;

  function drawSky(w,h){
    const g=ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'rgba(25,40,85,0.82)');
    g.addColorStop(0.48,'rgba(13,20,45,0.92)');
    g.addColorStop(1,'rgba(5,8,18,0.98)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

    for(let i=0;i<7;i++){
      const y=(h*0.10)+i*(h*0.085)+Math.sin(perfT*0.0007+i)*6;
      ctx.fillStyle=`rgba(255,255,255,${0.02+i*0.0013})`;
      ctx.fillRect(0,y,w,22);
    }
    ctx.fillStyle='rgba(0,0,0,0.20)';
    ctx.beginPath();
    ctx.ellipse(w*0.5,h*0.22,w*0.42,h*0.14,0,0,Math.PI*2);
    ctx.fill();
  }

  function drawRain(w,h){
    if(!storm.hasRain) return;
    if(rainDrops.length<620) spawnRain(18);
    ctx.lineWidth=1;
    for(let i=rainDrops.length-1;i>=0;i--){
      const d=rainDrops[i];
      ctx.strokeStyle='rgba(200,220,255,0.22)';
      ctx.beginPath();
      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x+d.vx*1.6,d.y+d.len);
      ctx.stroke();
      d.x+=d.vx; d.y+=d.vy;
      if(d.y>h+30){
        d.y=rand(-280,-20); d.x=rand(0,w);
        d.vy=rand(10,16); d.vx=rand(-1.1,1.1); d.len=rand(10,22);
      }
    }
  }

  function drawLightning(){
    if(!storm.bolt) return;
    const b=storm.bolt, a=b.t;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineJoin='round';

    ctx.strokeStyle=`rgba(255,255,255,${0.22*a})`;
    ctx.lineWidth=10;
    ctx.beginPath();
    ctx.moveTo(b.pts[0].x,b.pts[0].y);
    for(let i=1;i<b.pts.length;i++) ctx.lineTo(b.pts[i].x,b.pts[i].y);
    ctx.stroke();

    ctx.strokeStyle=`rgba(255,255,255,${0.88*a})`;
    ctx.lineWidth=3.2;
    ctx.beginPath();
    ctx.moveTo(b.pts[0].x,b.pts[0].y);
    for(let i=1;i<b.pts.length;i++) ctx.lineTo(b.pts[i].x,b.pts[i].y);
    ctx.stroke();

    if(b.branch){
      ctx.strokeStyle=`rgba(255,255,255,${0.55*a})`;
      ctx.lineWidth=2.6;
      ctx.beginPath();
      ctx.moveTo(b.branch[0].x,b.branch[0].y);
      for(let i=1;i<b.branch.length;i++) ctx.lineTo(b.branch[i].x,b.branch[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTornadoMain(w,h){
    // sim tornado drawn center-screen; mini-map is the “real position”
    const cx=w*0.5, topY=h*0.14, groundY=h*0.80;

    // white trail on sim
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<tornado.trail.length;i++){
      const p=tornado.trail[i];
      const a=i/tornado.trail.length;
      ctx.strokeStyle=`rgba(255,255,255,${0.055*a})`;
      ctx.lineWidth=12*a;
      ctx.beginPath();
      ctx.moveTo(p.sx,p.sy);
      ctx.lineTo(p.sx+0.01,p.sy+0.01);
      ctx.stroke();
    }
    ctx.restore();

    if(!storm.active) return;

    const fade=storm.ropingOut?(1-storm.vanishT):1;
    ctx.globalAlpha=fade;

    const d=dimsFor(storm.type, storm.ef, storm.ropingOut?storm.vanishT:0);
    const isRope=(storm.type==='rope' || storm.ropingOut);

    // silhouette fill
    const grad=ctx.createLinearGradient(0,topY,0,groundY);
    grad.addColorStop(0,'rgba(235,245,255,0.20)');
    grad.addColorStop(0.65,'rgba(220,235,255,0.14)');
    grad.addColorStop(1,'rgba(255,255,255,0.10)');

    ctx.fillStyle=grad;
    drawFunnelSilhouette(ctx, cx, topY, groundY, d, isRope);
    ctx.fill();

    // outline
    ctx.strokeStyle='rgba(255,255,255,0.40)';
    ctx.lineWidth=2.6;
    ctx.stroke();

    // debris base
    const baseW = widthAt(1, d);
    ctx.fillStyle='rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.ellipse(cx, groundY+12, baseW*0.62, 30, 0, 0, Math.PI*2);
    ctx.fill();

    // spin bands (rotation clearer)
    const spin=perfT*0.0068;
    ctx.save();
    ctx.clip();
    for(let i=0;i<14;i++){
      const t=i/13;
      const y=topY + t*(groundY-topY);
      const wHere = widthAt(t, d);

      const phase=spin + t*10.0;
      const xOff=Math.sin(phase) * (wHere*0.22);
      const ringW=wHere*0.46;
      const ringH=12+14*t;

      ctx.strokeStyle=`rgba(255,255,255,${0.16 - t*0.08})`;
      ctx.lineWidth=2.2;
      ctx.beginPath();
      ctx.ellipse(cx+xOff, y, ringW, ringH, 0, 0.15*Math.PI, 1.25*Math.PI);
      ctx.stroke();
    }
    ctx.restore();

    // rope thread
    if(isRope){
      ctx.strokeStyle='rgba(255,255,255,0.25)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(cx-6, topY);
      ctx.lineTo(cx+10, groundY);
      ctx.stroke();
    }

    ctx.globalAlpha=1;
  }

  function drawEmoji(c,emoji,x,y,size){
    c.font=`${size}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
    c.textAlign='center'; c.textBaseline='middle';
    c.fillText(emoji,x,y);
  }

  function drawMiniMap(){
    const w=mini.getBoundingClientRect().width;
    const h=mini.getBoundingClientRect().height;
    const sx=w/world.w, sy=h/world.h;

    mctx.clearRect(0,0,w,h);
    mctx.fillStyle='rgba(10,18,35,0.92)';
    mctx.fillRect(0,0,w,h);

    // grid
    mctx.strokeStyle='rgba(255,255,255,0.06)';
    mctx.lineWidth=1;
    for(let x=0;x<=world.w;x+=world.grid){ mctx.beginPath(); mctx.moveTo(x*sx,0); mctx.lineTo(x*sx,h); mctx.stroke(); }
    for(let y=0;y<=world.h;y+=world.grid){ mctx.beginPath(); mctx.moveTo(0,y*sy); mctx.lineTo(w,y*sy); mctx.stroke(); }

    const size=Math.max(15,Math.min(24,w/18));

    for(const o of world.objects) drawEmoji(mctx, o.kind==='house'?'🏠':'🌳', o.x*sx, o.y*sy, size);
    for(const c of world.cars) drawEmoji(mctx, '🚗', c.x*sx, c.y*sy, size);

    // trail
    if(tornado.trail.length){
      mctx.strokeStyle='rgba(255,255,255,0.20)';
      mctx.lineWidth=2;
      mctx.beginPath();
      for(let i=0;i<tornado.trail.length;i++){
        const p=tornado.trail[i];
        const px=p.wx*sx, py=p.wy*sy;
        if(i===0) mctx.moveTo(px,py); else mctx.lineTo(px,py);
      }
      mctx.stroke();
    }

    // tornado dot + radius
    const tx=tornado.x*sx, ty=tornado.y*sy;
    if(storm.active){
      const R=currentRadius();
      mctx.fillStyle='rgba(255,255,255,0.92)';
      mctx.beginPath(); mctx.arc(tx,ty,5,0,Math.PI*2); mctx.fill();

      mctx.strokeStyle='rgba(255,255,255,0.25)';
      mctx.lineWidth=2;
      mctx.beginPath(); mctx.arc(tx,ty,R*sx,0,Math.PI*2); mctx.stroke();
    } else {
      mctx.fillStyle='rgba(255,123,123,0.88)';
      mctx.beginPath(); mctx.arc(tx,ty,4,0,Math.PI*2); mctx.fill();
    }
  }

  function drawRadar(){
    const w=radar.getBoundingClientRect().width;
    const h=radar.getBoundingClientRect().height;
    const sx=w/world.w, sy=h/world.h;

    rctx.clearRect(0,0,w,h);
    rctx.fillStyle='rgba(0,25,12,0.86)';
    rctx.fillRect(0,0,w,h);

    const rr=Math.min(w,h)/2;
    rctx.strokeStyle='rgba(120,255,180,0.07)';
    rctx.lineWidth=1;
    for(let i=1;i<=7;i++){
      rctx.beginPath();
      rctx.arc(w/2,h/2,rr*(i/7),0,Math.PI*2);
      rctx.stroke();
    }

    // sweep line
    const cx=w/2, cy=h/2;
    const ang=storm.sweepAng;

    rctx.save();
    rctx.translate(cx,cy);
    rctx.rotate(ang);

    const grad=rctx.createRadialGradient(0,0,0,0,0,rr);
    grad.addColorStop(0,'rgba(120,255,180,0.10)');
    grad.addColorStop(1,'rgba(120,255,180,0.00)');
    rctx.fillStyle=grad;
    rctx.beginPath();
    rctx.moveTo(0,0);
    rctx.arc(0,0,rr,-0.22,0.0);
    rctx.closePath();
    rctx.fill();

    rctx.strokeStyle='rgba(180,255,210,0.65)';
    rctx.lineWidth=2;
    rctx.beginPath();
    rctx.moveTo(0,0);
    rctx.lineTo(rr,0);
    rctx.stroke();
    rctx.restore();

    // tornado point
    if(storm.active){
      const px=tornado.x*sx, py=tornado.y*sy;
      rctx.fillStyle='rgba(120,255,180,0.80)';
      rctx.beginPath(); rctx.arc(px,py,4,0,Math.PI*2); rctx.fill();
    }

    // blips
    for(const b of world.blips){
      const px=b.x*sx, py=b.y*sy;
      rctx.fillStyle=`rgba(255,255,255,${0.95*b.t})`;
      rctx.beginPath(); rctx.arc(px,py,3,0,Math.PI*2); rctx.fill();
    }
  }

  function updateStatus(){
    const kind=storm.type[0].toUpperCase()+storm.type.slice(1);
    statusLine1.innerHTML=`Storm: <b>${kind}</b> • EF<b>${storm.ef}</b> • Rain: <b>${storm.hasRain?'ON':'OFF'}</b> • Lightning: <b>${storm.hasLightning?'ON':'OFF'}</b>`;
    statusLine2.innerHTML=`Tornado: <b>${storm.active?(storm.ropingOut?'Roping out':'Active'):'Vanished'}</b> • Keep: <b>${storm.keepTornado?'ON':'OFF'}</b>`;
    statusLine3.innerHTML=`Mini-map: <b>moving now</b> • Radius: <b>${Math.round(currentRadius())} px</b>`;
  }

  // ---------- Main loop ----------
  let last=performance.now();
  function step(now){
    const dt=Math.min(0.033,(now-last)/1000);
    last=now; perfT=now;

    // ✅ tornado movement in WORLD coords (this is the mini-map dot)
    if(storm.active){
      let ix=0, iy=0;
      if(keys.ArrowLeft) ix-=1;
      if(keys.ArrowRight) ix+=1;
      if(keys.ArrowUp) iy-=1;
      if(keys.ArrowDown) iy+=1;

      const len=Math.hypot(ix,iy) || 1;
      ix/=len; iy/=len;

      const targetVx=ix * tornado.speed;
      const targetVy=iy * tornado.speed;

      // smooth accel, keep old velocity
      tornado.vx = lerp(tornado.vx, targetVx, 0.20);
      tornado.vy = lerp(tornado.vy, targetVy, 0.20);

      tornado.x = clamp(tornado.x + tornado.vx*dt, 0, world.w);
      tornado.y = clamp(tornado.y + tornado.vy*dt, 0, world.h);
    } else {
      // if vanished, stop
      tornado.vx *= 0.85;
      tornado.vy *= 0.85;
    }

    // rope-out
    if(!storm.keepTornado && storm.active && !storm.ropingOut) startRopeOut();
    if(storm.ropingOut){
      storm.vanishT += dt*0.28;
      if(storm.vanishT>=1){
        storm.vanishT=1;
        storm.active=false;
        storm.ropingOut=false;
      }
    }

    // trail
    const simW=sim.getBoundingClientRect().width;
    const simH=sim.getBoundingClientRect().height;
    const sx=simW*0.5 + Math.sin(now*0.005)*2;
    const sy=simH*0.56 + Math.cos(now*0.004)*2;
    tornado.trail.push({wx:tornado.x, wy:tornado.y, sx, sy});
    if(tornado.trail.length>120) tornado.trail.shift();

    // lightning
    storm.boltCooldown=Math.max(0,storm.boltCooldown-dt);
    if(storm.hasLightning && storm.boltCooldown<=0 && Math.random()<0.015){
      generateBolt(simW,simH);
      storm.boltCooldown=0.8+Math.random()*0.7;
    }
    if(storm.bolt){
      storm.bolt.t -= dt*2.2;
      if(storm.bolt.t<=0) storm.bolt=null;
    }

    // radar sweep
    storm.sweepAng += dt*2.2;
    if(storm.sweepAng>Math.PI*2) storm.sweepAng-=Math.PI*2;

    // world updates
    updateCars(dt);
    tornadoAffectsThings(dt);
    updateObjects(dt);

    // blip decay
    for(let i=world.blips.length-1;i>=0;i--){
      world.blips[i].t -= dt*1.25;
      if(world.blips[i].t<=0) world.blips.splice(i,1);
    }

    resizeAll();
    draw();
    syncUI();
    updateStatus();
    requestAnimationFrame(step);
  }

  function draw(){
    const w=sim.getBoundingClientRect().width;
    const h=sim.getBoundingClientRect().height;

    ctx.clearRect(0,0,w,h);
    drawSky(w,h);

    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.fillRect(0,h*0.78,w,h*0.22);

    drawRain(w,h);
    drawTornadoMain(w,h);
    drawLightning();

    ctx.fillStyle='rgba(233,238,255,0.86)';
    ctx.font='950 14px system-ui';
    const kind=storm.type[0].toUpperCase()+storm.type.slice(1);
    ctx.fillText(`${kind} • EF${storm.ef}`,14,24);

    drawMiniMap();
    drawRadar();
  }

  // ---------- Start ----------
  buildWorld();
  syncUI();
  updateStatus();
  resizeAll();
  requestAnimationFrame(step);
})();
</script>
</body>
